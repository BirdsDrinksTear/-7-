<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동물 도감 - 한강 생태 탐험대</title> 
  <!-- 식물 삭제 - 동식물을 동물로 타이틀 변경하였습니다 -->
<link rel="stylesheet" href="./css/style.css">
<style>
.page-hero { background: linear-gradient(135deg,#1a3c5e 0%,#2e86c1 60%,#27ae60 100%); padding: calc(var(--nav-h)+52px) 24px 52px; text-align:center; }
.page-hero h1 { font-family:'Jua',sans-serif; font-size:clamp(1.8rem,4vw,2.8rem); color:#fff; margin-bottom:10px; }
.page-hero p  { color:rgba(255,255,255,0.85); font-size:1rem; max-width:520px; margin:0 auto; }

/* filter tabs */
.filter-bar { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding:36px 24px 0; }
.filter-btn {
  padding:9px 22px; border-radius:24px; border:2px solid #d0dde8;
  background:#fff; font-family:'Jua',sans-serif; font-size:0.9rem;
  cursor:pointer; transition:all 0.18s; color:var(--dark);
}
.filter-btn:hover { border-color:var(--river); color:var(--river); }
.filter-btn.active { background:var(--river-dark); border-color:var(--river-dark); color:#fff; }

/* grid */
.animal-grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
  gap:22px;
  max-width:1140px; margin:32px auto 80px; padding:0 24px;
}
.animal-card {
  background:#fff; border-radius:20px;
  box-shadow:0 4px 18px rgba(0,0,0,0.07);
  overflow:hidden;
  transition:transform 0.2s, box-shadow 0.2s;
  cursor:pointer;
}
.animal-card:hover { transform:translateY(-6px); box-shadow:0 12px 32px rgba(0,0,0,0.13); }
.animal-card.hidden { display:none; }

.ac-top {
  padding:28px 20px 20px;
  display:flex; align-items:center; gap:16px;
}
.ac-emoji { font-size:3.2rem; flex-shrink:0; }
.ac-header h3 { font-family:'Jua',sans-serif; font-size:1.15rem; margin-bottom:4px; }
.ac-header .badges { display:flex; gap:6px; flex-wrap:wrap; }

.ac-body { padding:0 20px 20px; }
.ac-desc { font-size:0.88rem; color:#555; line-height:1.7; margin-bottom:14px; }
.ac-facts { list-style:none; }
.ac-facts li {
  font-size:0.82rem; color:#444;
  padding:5px 0; border-bottom:1px solid #f0f4f8;
  display:flex; gap:6px;
}
.ac-facts li:last-child { border-bottom:none; }
.ac-facts li::before { content:'•'; color:var(--river); font-weight:700; }

/* detail modal */
.detail-modal {
  display:none; position:fixed; inset:0; z-index:800;
  background:rgba(0,0,0,0.55);
  align-items:center; justify-content:center; padding:20px;
}
.detail-modal.show { display:flex; }
.detail-card {
  background:#fff; border-radius:24px;
  padding:40px 36px; max-width:500px; width:100%;
  max-height:88vh; overflow-y:auto;
  animation:popIn 0.25s ease;
  position:relative;
}
@keyframes popIn { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }
.detail-close {
  position:absolute; top:16px; right:18px;
  background:none; border:none; font-size:1.5rem; cursor:pointer; color:#aaa;
}
.d-emoji { font-size:5rem; text-align:center; margin-bottom:10px; }
.d-name  { font-family:'Jua',sans-serif; font-size:1.8rem; text-align:center; margin-bottom:8px; }
.d-badges { text-align:center; margin-bottom:16px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
.d-desc  { font-size:0.97rem; color:#444; line-height:1.8; margin-bottom:20px; }
.d-facts { background:#f6fafd; border-radius:14px; padding:16px 20px; margin-bottom:22px; }
.d-facts h4 { font-family:'Jua',sans-serif; font-size:0.95rem; color:var(--river-dark); margin-bottom:10px; }
.d-facts ul { list-style:none; }
.d-facts ul li { font-size:0.88rem; color:#444; padding:4px 0; border-bottom:1px solid #e8f0f7; display:flex; gap:8px; }
.d-facts ul li:last-child { border-bottom:none; }
.d-facts ul li::before { content:'▸'; color:var(--river); }
.d-quiz-hint { background:#fff8e8; border:1px solid #f5c842; border-radius:12px; padding:12px 16px; font-size:0.85rem; color:#7d5a00; text-align:center; }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="nav-brand" href="index.html">🌊 <span>한강</span> 생태 탐험대</a>
  <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">홈</a></li>
    <li><a href="animals.html" class="active">동물 도감</a></li>
    <li><a href="game.html">퀴즈</a></li>
    <li><a href="volunteer.html">봉사활동</a></li>
    <li><a href="form.html">신청하기</a></li>
    <li><a href="team.html">팀 소개</a></li>
  </ul>
</nav>

<div class="page-hero">
  <h1>🦦 동물 도감</h1> 
  <!-- 마찬가지로 동식물을 동물로 -->
  <p>한강 대표 동물 6종을 만나보세요.<br>카드를 클릭하면 더 자세한 정보를 볼 수 있어요!</p>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-cat="all">전체 보기</button>
  <button class="filter-btn" data-cat="bird">🐦 조류</button>
  <button class="filter-btn" data-cat="mammal">🦦 포유류</button>
  <button class="filter-btn" data-cat="fish">🐟 물속 생물</button>
  <button class="filter-btn" data-cat="invasive">⚠️ 생태위협종</button>
</div>

<div class="animal-grid" id="animalGrid"></div>

<!-- Detail Modal -->
<div class="detail-modal" id="detailModal">
  <div class="detail-card">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div class="d-emoji"  id="dEmoji"></div>
    <div class="d-name"   id="dName"></div>
    <div class="d-badges" id="dBadges"></div>
    <div class="d-desc"   id="dDesc"></div>
    <div class="d-facts">
      <h4>📋 주요 정보</h4>
      <ul id="dFacts"></ul>
    </div>
    <div class="d-quiz-hint">💡 이 내용은 퀴즈에 나올 수 있어요! <a href="game.html" style="color:var(--accent);font-weight:700;">퀴즈 풀러 가기 →</a></div>
  </div>
</div>

<footer class="site-footer">
  <p>🌊 한강 생태 탐험대 | 교육 목적 프로젝트</p>
</footer>

<script>
const animals_old = [
  /* ── 조류 ── */

    short:'한강 최고의 사냥꾼. 물가에 꼼짝않고 서 있다가 순간 낚아채요.',

  { key:'duck', emoji:'🦆', name:'청둥오리', cat:'bird', zone:'중류', zoneBadge:'badge-blue',

// ── 카드 렌더링 ──
function renderCards(cat) {
  const grid = document.getElementById('animalGrid');
  grid.innerHTML = '';
  animals.forEach(a => {
    if (cat !== 'all' && a.cat !== cat) return;
    const card = document.createElement('div');
    card.className = 'animal-card';
    card.innerHTML = `
      <div class="ac-top">
        <div class="ac-emoji">${a.emoji}</div>
        <div class="ac-header">
          <h3>${a.name}</h3>
          <div class="badges">
            <span class="badge ${a.zoneBadge}">${a.zone}</span>
            <span class="badge ${a.cat==='invasive'?'badge-red':a.cat==='bird'?'badge-blue':a.cat==='mammal'?'badge-green':'badge-orange'}">${catLabel(a.cat)}</span>
          </div>
        </div>
      </div>
      <div class="ac-body">
        <div class="ac-desc">${a.short}</div>
        <ul class="ac-facts">
          ${a.facts.slice(0,3).map(f=>`<li>${f}</li>`).join('')}
        </ul>
      </div>`;
    card.addEventListener('click', () => openDetail(a));
    grid.appendChild(card);
  });
}

function catLabel(cat) {
  return {bird:'조류',mammal:'포유류',fish:'물속 생물',invasive:'⚠️위협종'}[cat]||cat;
}

// ── 필터 ──
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(btn.dataset.cat);
  });
});

// ── 상세 모달 ──
function openDetail(a) {
  document.getElementById('dEmoji').textContent   = a.emoji;
  document.getElementById('dName').textContent    = a.name;
  document.getElementById('dBadges').innerHTML    = `
    <span class="badge ${a.zoneBadge}">${a.zone}</span>
    <span class="badge ${a.cat==='invasive'?'badge-red':'badge-orange'}">${catLabel(a.cat)}</span>`;
  document.getElementById('dDesc').textContent    = a.desc;
  document.getElementById('dFacts').innerHTML     = a.facts.map(f=>`<li>${f}</li>`).join('');
  document.getElementById('detailModal').classList.add('show');
}
function closeDetail() {
  document.getElementById('detailModal').classList.remove('show');
}
document.getElementById('detailModal').addEventListener('click', e => {
  if (e.target===document.getElementById('detailModal')) closeDetail();
});

// ── 햄버거 ──
document.getElementById('navToggle').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

renderCards('all');
</script>
